{% extends 'base.html' %} {% block header %}
<h1>Welcome to Phys-Adapt, {{ g.user['username'] }}</h1>
{% endblock %} {% block content %}

<div class="chart-container">
  {% for data in score_data %}
  <div class="bar-title">{{data["module_name"]}}</div>
  <div class="stacked-bar">
    <div class="segment correct" style="width: {{data["correct_percent"]}}%">{{data["correct_score"]}}</div>
    <div class="segment incorrect" style="width: {{data["incorrect_percent"]}}%">{{data["incorrect_score"]}}</div>
  </div>
  {% endfor %} {% endblock %}
</div>
